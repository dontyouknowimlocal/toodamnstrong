name: Deploy Beer Dashboard
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update Beer Data"]
    types: [completed]
  workflow_dispatch: # Allows the workflow to be run manually from the GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/venue-menu-history.json _site/data/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
